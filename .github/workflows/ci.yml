name: Playwright CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar o código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Instalar dependências do projeto
        run: npm ci

      - name: 4. Instalar o navegador Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: 5. Testar se o Build do Vite compila sem erros
        run: npm run build

      - name: 6. Rodar os testes automatizados E2E
        run: npx playwright test

      - name: 7. Salvar relatório de testes (caso algum teste falhe)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7